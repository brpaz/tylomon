# Example Docker Compose setup for testing tylomon
#
# Start the services:
#   cd examples && docker compose up -d
#
# Monitor with tylomon (pick the project from the list):
#   cd examples && sudo tylomon
#
# Or directly:
#   sudo tylomon --project tylomon-example
#   sudo tylomon --network tylomon-example_default
#
# The setup creates five services:
#   - api:       Nginx serving a simple JSON endpoint
#   - poller:    Hits the API every 2 seconds
#   - gateway:   Nginx reverse proxy that forwards to the API
#   - db:        PostgreSQL
#   - sqlclient: Runs a few queries against the database every 3 seconds
#
# Traffic flow:
#   poller → gateway → api
#   sqlclient → db            (PostgreSQL, one query fails on purpose)
#
# Services sit on two networks (frontend: poller/gateway, backend: gateway/api), so
# tylomon captures on both bridges when the project is selected.
#
# You should see HTTP requests between the first three containers and SQL queries between
# the last two in tylomon (try the filter `proto:pg`).

name: tylomon-example

services:
  api:
    image: nginx:alpine
    networks: [backend]
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    image: nginx:alpine
    networks: [frontend, backend]
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  poller:
    image: curlimages/curl:latest
    networks: [frontend]
    depends_on:
      - gateway
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          echo "--- $$(date) ---"
          curl -s -H "X-Request-Id: $$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 8)" \
               -H "Accept: application/json" \
               http://gateway/api/health
          echo ""
          sleep 2
          curl -s -X POST \
               -H "Content-Type: application/json" \
               -H "X-Request-Id: $$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 8)" \
               -d '{"action":"ping","timestamp":"'"$$(date -Iseconds)"'"}' \
               http://gateway/api/echo
          echo ""
          sleep 2
        done

  db:
    image: postgres:18-alpine
    networks: [backend]
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqlclient:
    image: postgres:18-alpine
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: example
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          psql -h db -U postgres -d shop \
            -c "CREATE TABLE IF NOT EXISTS visits (id serial PRIMARY KEY, path text UNIQUE)" \
            -c "INSERT INTO visits (path) VALUES ('/home') ON CONFLICT DO NOTHING" \
            -c "SELECT id, path FROM visits ORDER BY id" \
            -c "INSERT INTO visits (path) VALUES ('/home')"
          sleep 3
        done

networks:
  frontend:
  backend:
