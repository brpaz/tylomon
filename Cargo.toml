[package]
name = "tylomon"
version = "0.1.0"
edition = "2024"
description = "Monitor HTTP traffic between Docker containers"
license = "MIT"
repository = "https://github.com/brunopaz/tylomon"

[[bin]]
name = "tylomon"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "=0.29.0"
crossterm = { version = "=0.28.1", features = ["event-stream"] }

# Async runtime
tokio = { version = "=1.49.0", features = ["full"] }
tokio-stream = "=0.1.18"
futures = "=0.3.31"

# Docker API
bollard = "=0.18.1"

# Packet capture & parsing
pcap = { version = "=2.4.0", features = ["capture-stream"] }
etherparse = "=0.16.0"

# HTTP parsing
httparse = "=1.10.1"

# CLI
clap = { version = "=4.5.57", features = ["derive"] }

# Error handling
anyhow = "1"

# Serialization
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Clipboard
arboard = "=3.6.1"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }
tracing-appender = "=0.2.4"

[dev-dependencies]
pretty_assertions = "=1.4.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
