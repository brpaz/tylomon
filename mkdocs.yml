site_name: tylomon
site_description: Monitor HTTP traffic between Docker containers
site_url: https://brunopaz.github.io/tylomon
repo_url: https://github.com/brunopaz/tylomon
repo_name: brunopaz/tylomon

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Usage: getting-started/usage.md
  - Reference:
      - Architecture: reference/architecture.md
      - CLI Options: reference/cli.md
      - Keyboard Shortcuts: reference/keybindings.md
  - Development:
      - Setup: development/setup.md
      - Contributing: development/contributing.md
