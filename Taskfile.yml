version: "3"

vars:
  BINARY_NAME: tylomon

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  fmt:
    desc: Format code
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting
    cmds:
      - cargo fmt --all --check

  clippy:
    desc: Run clippy lints
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  test:
    desc: Run tests
    cmds:
      - cargo nextest run

  e2e:
    desc: Capture the examples/ stack and assert on the exchanges (needs Docker, jq, sudo)
    deps: [build]
    cmds:
      - scripts/e2e.sh target/debug/{{.BINARY_NAME}}

  build:
    desc: Build debug binary
    cmds:
      - cargo build

  build:release:
    desc: Build release binary
    cmds:
      - cargo build --release --locked

  install:
    desc: Build the release binary, install it and grant packet capture capabilities
    deps: [build:release]
    vars:
      INSTALL_DIR: '{{.INSTALL_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
      SETCAP: '{{.SETCAP | default "true"}}'
    cmds:
      - |
        set -e
        dir="{{.INSTALL_DIR}}"
        bin="$dir/{{.BINARY_NAME}}"
        if mkdir -p "$dir" 2>/dev/null && [ -w "$dir" ]; then sudo_cmd=""; else sudo_cmd="sudo"; fi
        $sudo_cmd install -Dm755 target/release/{{.BINARY_NAME}} "$bin"
        echo "Installed $bin"
        if [ "{{.SETCAP}}" = "true" ]; then
          sudo setcap cap_net_raw,cap_net_admin=eip "$bin"
          echo "Granted CAP_NET_RAW and CAP_NET_ADMIN: no sudo needed to run it"
        fi
        case ":$PATH:" in *":$dir:"*) ;; *) echo "Note: $dir is not on your PATH" ;; esac

  uninstall:
    desc: Remove the installed binary
    vars:
      INSTALL_DIR: '{{.INSTALL_DIR | default (printf "%s/.local/bin" (env "HOME"))}}'
    cmds:
      - |
        bin="{{.INSTALL_DIR}}/{{.BINARY_NAME}}"
        if [ -w "$(dirname "$bin")" ]; then rm -f "$bin"; else sudo rm -f "$bin"; fi
        echo "Removed $bin"

  setcap:
    desc: Build the debug binary and grant it packet capture capabilities
    deps: [build]
    cmds:
      - sudo setcap cap_net_raw,cap_net_admin=eip target/debug/{{.BINARY_NAME}}

  run:
    desc: Run in development mode (grants capture capabilities, no root needed at runtime)
    cmds:
      - task: setcap
      - ./target/debug/{{.BINARY_NAME}} {{.CLI_ARGS}}

  watch:
    desc: Watch and rebuild on changes
    cmds:
      - cargo watch -x build

  lint:
    desc: Run all lints (fmt check + clippy)
    cmds:
      - task: fmt:check
      - task: clippy

  ci:
    desc: Run full CI pipeline locally
    cmds:
      - task: fmt:check
      - task: clippy
      - task: test
      - task: build:release

  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t tylomon:local .

  docker:run:
    desc: Run Docker image with network capabilities
    cmds:
      - >-
        docker run --rm -it
        --cap-add=NET_RAW --cap-add=NET_ADMIN
        --network host
        tylomon:local {{.CLI_ARGS}}

  docs:serve:
    desc: Serve documentation locally
    cmds:
      - uv run --no-project --with-requirements requirements-docs.txt zensical serve

  docs:build:
    desc: Build documentation site
    cmds:
      - uv run --no-project --with-requirements requirements-docs.txt zensical build --clean --strict

  example:up:
    desc: Start example Docker Compose services
    dir: examples
    cmds:
      - docker compose up -d

  example:down:
    desc: Stop example Docker Compose services
    dir: examples
    cmds:
      - docker compose down

  example:logs:
    desc: Show example service logs
    dir: examples
    cmds:
      - docker compose logs -f

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
