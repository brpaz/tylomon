# Example Docker Compose setup for testing tylomon
#
# Start the services:
#   cd examples && docker compose up -d
#
# Monitor with tylomon (pick the project from the list):
#   cd examples && sudo tylomon
#
# Or directly:
#   sudo tylomon --project tylomon-example
#   sudo tylomon --network tylomon-example_default
#
# The setup creates three services:
#   - api:      Nginx serving a simple JSON endpoint
#   - poller:   Hits the API every 2 seconds
#   - gateway:  Nginx reverse proxy that forwards to the API
#
# Traffic flow:
#   poller → gateway → api
#
# Services sit on two networks (frontend: poller/gateway, backend: gateway/api), so
# tylomon captures on both bridges when the project is selected.
#
# You should see HTTP requests between all three containers in tylomon.

name: tylomon-example

services:
  api:
    image: nginx:alpine
    networks: [backend]
    volumes:
      - ./nginx-api.conf:/etc/nginx/conf.d/default.conf:ro

  gateway:
    image: nginx:alpine
    networks: [frontend, backend]
    volumes:
      - ./nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  poller:
    image: curlimages/curl:latest
    networks: [frontend]
    depends_on:
      - gateway
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          echo "--- $$(date) ---"
          curl -s -H "X-Request-Id: $$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 8)" \
               -H "Accept: application/json" \
               http://gateway/api/health
          echo ""
          sleep 2
          curl -s -X POST \
               -H "Content-Type: application/json" \
               -H "X-Request-Id: $$(cat /dev/urandom | tr -dc 'a-f0-9' | head -c 8)" \
               -d '{"action":"ping","timestamp":"'"$$(date -Iseconds)"'"}' \
               http://gateway/api/echo
          echo ""
          sleep 2
        done

networks:
  frontend:
  backend:
