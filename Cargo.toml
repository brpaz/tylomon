[package]
name = "tylomon"
version = "0.1.0"
edition = "2024"
description = "Monitor HTTP traffic between Docker containers"
license = "MIT"
repository = "https://github.com/brunopaz/tylomon"

[[bin]]
name = "tylomon"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["event-stream"] }

# Async runtime
tokio = { version = "=1.53.3", features = ["full"] }
tokio-stream = "=0.1.19"
futures = "=0.3.34"

# Docker API
bollard = "=0.21.1"

# Packet capture & parsing
pcap = { version = "=2.5.0", features = ["capture-stream"] }
etherparse = "=0.21.0"

# HTTP parsing
httparse = "=1.10.1"
flate2 = "=1.1.10"
brotli = "=9.0.0"

# CLI
clap = { version = "=4.6.7", features = ["derive"] }

# Error handling
anyhow = "1"

# Serialization
base64 = "=0.23.1"
serde_yaml_ng = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Clipboard
arboard = { version = "=3.7.0", features = ["wayland-data-control"] }

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "=0.2.5"

[dev-dependencies]
libc = "=0.2.190"
pretty_assertions = "=1.4.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
