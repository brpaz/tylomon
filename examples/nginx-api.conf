# API backend — serves JSON responses
server {
    listen 80;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api","uptime":"$request_time"}';
    }

    location /echo {
        default_type application/json;

        if ($request_method = POST) {
            return 200 '{"received":true,"method":"POST","uri":"$request_uri","host":"$host"}';
        }

        return 200 '{"received":true,"method":"$request_method","uri":"$request_uri","host":"$host"}';
    }

    location / {
        default_type application/json;
        return 200 '{"service":"api","endpoints":["/health","/echo"]}';
    }
}
